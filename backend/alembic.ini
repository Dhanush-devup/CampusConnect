# Alembic configuration for CampusConnect.
# The database URL comes from app.config (DATABASE_URL in .env), not from here.
#
# Usage (from the backend/ folder):
#   alembic upgrade head                          apply all migrations
#   alembic revision --autogenerate -m "message"  create a migration from model changes
#   alembic downgrade -1                          undo the last migration
#
# The app runs migrations itself on startup (app.database.upgrade_db), including
# stamping databases created before Alembic. Only if you use the CLI on such a
# database, run "alembic stamp 0001" once first.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
